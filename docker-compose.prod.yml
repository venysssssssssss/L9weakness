services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: L9Weakness
    restart: unless-stopped
    env_file:
      - discord-bot/.env
    ports:
      - "${ARENA_PORT:-3000}:${ARENA_PORT:-3000}" # mesa web da Arena MTG
    networks:
      - default
      - deploy_default
    volumes:
      - ./discord-bot/data:/app/data
      - ./discord-bot/logs:/app/logs
    # Para voice, precisa de rede host? Mantém bridge por padrão
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  deploy_default:
    external: true
